<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Forge browser feasibility</title>
<style>body{font:16px system-ui;margin:24px;background:#f5f5f1;color:#222}button{padding:9px;margin:3px;cursor:pointer}button:disabled{cursor:default}.players{display:grid;grid-template-columns:1fr 1fr;gap:16px}.seat{background:white;padding:12px;border:1px solid #aaa}.cards{display:flex;flex-wrap:wrap}.card{max-width:180px;font-size:13px;text-align:left}.selected{outline:3px solid green}.tapped{opacity:.55}pre{white-space:pre-wrap}.prompt{padding:16px;background:#e6efff;margin-bottom:16px}#error{color:#9a1515}label{display:block;padding:6px}h3{margin-bottom:4px}#stack{padding:12px}small{display:block}</style>
<h1>Forge browser feasibility</h1><p>Local disposable proof · one human / one CPU · Forge decides every game action.</p><p id="status">Starting</p><p id="error" role="alert"></p><div id="prompt" class="prompt"></div><div id="stack"></div><div id="players" class="players"></div>
<details><summary>Boundary checks</summary><button id="stale">Send stale revision</button><button id="invalid">Send invalid entity</button><button id="duplicate">Repeat last request</button><button id="replay">Repeat prompt with new request</button><button id="badchoice">Send invalid choice</button><pre id="checks"></pre></details>
<script>
const token='CSRF_TOKEN';let state={},lastRevision=-1,lastRequest=null;
const $=id=>document.getElementById(id);const elem=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
async function send(action,extra={},test=false){const body={csrf:token,session:state.session,revision:state.revision,prompt:state.prompt?.id,request:crypto.randomUUID(),action,...extra};if(!test)lastRequest=body;return post(body,test)}
async function post(body,test=false){const res=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(test){$('checks').textContent+=`${res.status} ${JSON.stringify(data)}\n`}else{$('error').textContent=res.ok?'':data.error}return res.ok}
function button(text,action,extra,disabled=false){const b=elem('button',text);b.disabled=disabled;b.onclick=()=>send(action,extra);return b}
function render(s){state=s;$('status').textContent=`${s.status} · turn ${s.turn??'—'} · ${s.turnPlayer??''} · ${s.phase??''}${s.result?' · Winner: '+s.result:''}`;$('prompt').replaceChildren();$('players').replaceChildren();$('stack').replaceChildren();$('error').textContent=s.actionError||'';if(s.error)$('error').textContent=s.error;
const p=s.prompt;if(p){$('prompt').append(elem('h2',p.kind),elem('pre',p.text));if(s.status==='choice'&&p.ordering){const rows=[];const submit=elem('button','Submit order');const race=elem('button','Submit order twice (boundary test)');submit.disabled=true;race.disabled=true;for(let i=0;i<p.options.length;i++){const label=elem('label',`Resolve position ${i+1} `);const select=elem('select','');select.setAttribute('aria-label',`Resolve position ${i+1}`);const empty=elem('option','Choose an ability');empty.value='';select.append(empty);for(const o of p.options){const option=elem('option',o.label);option.value=o.id;select.append(option)}select.onchange=()=>{const ids=rows.map(x=>x.value);submit.disabled=race.disabled=ids.some(x=>x==='')||new Set(ids).size!==p.options.length};rows.push(select);label.append(select);$('prompt').append(label)}const selected=()=>rows.map(x=>Number(x.value));submit.onclick=()=>send('reply',{selected:selected()});race.onclick=()=>Promise.all([send('reply',{selected:selected()},true),send('reply',{selected:selected()},true)]);$('prompt').append(submit,race,elem('small','All positions must be chosen explicitly. Remember decision is disabled.'))}else if(s.status==='choice'){for(const o of p.options){const label=elem('label','');const input=document.createElement('input');input.type=p.max===1?'radio':'checkbox';input.name='choice';input.value=o.id;input.disabled=p.max===0;label.append(input,document.createTextNode(' '+o.label));$('prompt').append(label)}const submit=elem('button','Submit choice');submit.id='reply';submit.onclick=()=>send('reply',{selected:[...document.querySelectorAll('input[name=choice]:checked')].map(x=>Number(x.value))});const race=elem('button','Submit choice twice (boundary test)');race.onclick=async()=>{const selected=[...document.querySelectorAll('input[name=choice]:checked')].map(x=>Number(x.value));await Promise.all([send('reply',{selected},true),send('reply',{selected},true)])};$('prompt').append(submit,race,elem('small',`Choose ${p.min}–${p.max}.`))}else{$('prompt').append(button(p.ok,'ok',{},!p.okEnabled),button(p.cancel,'cancel',{},!p.cancelEnabled))}}
$('stack').append(elem('strong','Stack: '+(s.stack?.map(x=>x.source).join(' → ')||'empty')));
for(const player of s.players||[]){const section=elem('section','');section.className='seat';section.append(button(`${player.name} · ${player.life} life`,'player',{id:player.id},s.status!=='input'));for(const zone of player.zones){const wrap=elem('div','');wrap.append(elem('h3',`${zone.zone} (${zone.count})`));const cards=elem('div','');cards.className='cards';for(const c of zone.cards){const b=button(`${c.name}${c.mana?' '+c.mana:''}${c.pt?' · '+c.pt:''}${c.attacking?' · attacking':''}${c.blocking?' · blocking':''}`,'card',{id:c.id},s.status!=='input'||c.id===undefined);b.className='card'+(c.tapped?' tapped':'')+(c.selected?' selected':'');cards.append(b)}wrap.append(cards);section.append(wrap)}$('players').append(section)}}
$('stale').onclick=()=>send('ok',{revision:state.revision-1},true);$('invalid').onclick=()=>send('card',{id:-999},true);$('duplicate').onclick=()=>lastRequest?post(lastRequest,true):$('checks').textContent+='Make a choice first.\n';
$('replay').onclick=()=>lastRequest?post({...lastRequest,request:crypto.randomUUID()},true):null;$('badchoice').onclick=()=>send('reply',{selected:[-1]},true);
setInterval(async()=>{try{const s=await(await fetch('/state')).json();if(s.revision!==lastRevision){lastRevision=s.revision;render(s)}}catch(e){$('status').textContent='Local engine unavailable'}},200);
</script></html>
