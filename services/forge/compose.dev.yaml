name: manatomb-forge-dev
services:
  forge:
    image: ${FORGE_DEV_IMAGE:-manatomb-forge:dev}
    platform: linux/amd64
    environment:
      FORGE_SERVICE_SECRET: ${FORGE_SERVICE_SECRET:?Set FORGE_SERVICE_SECRET in the root .env}
      FORGE_MAX_GAMES: '1'
    ports: ['127.0.0.1:8081:8081']
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid
    restart: unless-stopped
    stop_grace_period: 10s
