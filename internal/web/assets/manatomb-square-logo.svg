<?xml version="1.0" encoding="UTF-8"?>
<!-- Vector reconstruction of the supplied ManaTomb square logo. No fonts or external assets. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">ManaTomb square logo</title>
  <desc id="description">Gold MT monogram on a rounded, near-black navy app icon.</desc>
  <defs>
    <linearGradient id="navy" x1="134" y1="75" x2="1030" y2="1185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13233A"/>
      <stop offset="0.42" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#040811"/>
    </linearGradient>
    <radialGradient id="navyBloom" cx="0" cy="0" r="1" gradientTransform="translate(612 386) rotate(90) scale(854 893)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172942" stop-opacity="0.45"/>
      <stop offset="0.63" stop-color="#0A1525" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#02050B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="292" y1="282" x2="792" y2="1020" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD97D"/>
      <stop offset="0.31" stop-color="#F5B944"/>
      <stop offset="0.65" stop-color="#D18C1D"/>
      <stop offset="1" stop-color="#B56C12"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="402" y1="272" x2="760" y2="729" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF0AC"/>
      <stop offset="0.5" stop-color="#FFD875"/>
      <stop offset="1" stop-color="#D69426"/>
    </linearGradient>
    <filter id="monogramShadow" x="204" y="226" width="846" height="839" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#00040B" flood-opacity="0.72"/>
    </filter>
    <clipPath id="roundedSquare">
      <rect width="1254" height="1254" rx="267"/>
    </clipPath>
  </defs>

  <!-- The source image has black outside the rounded app-icon field. -->
  <rect width="1254" height="1254" rx="267" fill="url(#navy)"/>
  <rect width="1254" height="1254" rx="267" fill="url(#navyBloom)"/>
  <g clip-path="url(#roundedSquare)">
    <rect x="2" y="2" width="1250" height="1250" rx="265" fill="none" stroke="#172945" stroke-opacity="0.24" stroke-width="4"/>
  </g>

